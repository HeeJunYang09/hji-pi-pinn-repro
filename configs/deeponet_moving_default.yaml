  sigma_scale: 0.1
  domain_t: [0.0, 1.0]
  domain_x: [-1.0, 1.0]

targets:
  train:
    - [0.3, 0.3]
    - [0.3, 0.6]
    - [0.3, 0.9]
    - [0.6, 0.3]
    - [0.6, 0.6]
    - [0.6, 0.9]
    - [0.9, 0.3]
    - [0.9, 0.6]
    - [0.9, 0.9]
