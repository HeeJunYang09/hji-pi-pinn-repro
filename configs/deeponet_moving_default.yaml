    - [0.45, 0.45]
    - [0.45, 0.75]
    - [0.75, 0.45]
    - [0.75, 0.75]

deeponet:
  sensor_num_per_dim: 9
  basis_dim: 64
  width: 64
  depth: 4

train:
  points_per_target: 2000
  num_iters: 1000
  num_epochs: 1000
